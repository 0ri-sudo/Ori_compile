name: Build Ori DE iOS IPA (From GitHub Release Split Archives)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag de la Release GitHub contenant les archives découpées (laisser vide pour prendre la dernière Release)"
        required: false
        default: ""
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-ipa:
    name: Download Split Xcode Project & Compile IPA on macOS
    runs-on: macos-14
    timeout-minutes: 120

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install 7-Zip & Tools (Homebrew)
        run: |
          brew install sevenzip

      - name: Download Split Archives from GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ github.event.inputs.release_tag }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
        run: |
          mkdir -p release_download
          cd release_download

          TARGET_TAG="${INPUT_TAG:-$EVENT_TAG}"
          if [ -z "$TARGET_TAG" ]; then
            TARGET_TAG=$(gh release list --repo "${{ github.repository }}" --limit 1 --json tagName -q '.[0].tagName' || true)
          fi

          if [ -n "$TARGET_TAG" ]; then
            echo "Téléchargement des fichiers depuis la Release : $TARGET_TAG"
            gh release download "$TARGET_TAG" --pattern "ios_xcode_build*" --repo "${{ github.repository }}" || gh release download "$TARGET_TAG" --pattern "*" --repo "${{ github.repository }}"
          else
            echo "Téléchargement des fichiers depuis la dernière Release..."
            gh release download --pattern "ios_xcode_build*" --repo "${{ github.repository }}" || gh release download --pattern "*" --repo "${{ github.repository }}"
          fi

          echo "Fichiers téléchargés depuis la Release :"
          ls -lh

      - name: Extract Split Archives & Locate Xcode Project
        run: |
          mkdir -p extracted_xcode
          cd release_download

          # Détecte automatiquement le format de découpage (.7z.001, .zip.001, .tar.gz.part*, .rar, .7z, .zip)
          if ls *.7z.001 1>/dev/null 2>&1; then
            FIRST_PART=$(ls *.7z.001 | head -n 1)
            echo "Extraction de l'archive multi-volume 7z : $FIRST_PART"
            7zz x "$FIRST_PART" -o../extracted_xcode -y
          elif ls *.zip.001 1>/dev/null 2>&1; then
            FIRST_PART=$(ls *.zip.001 | head -n 1)
            echo "Extraction de l'archive multi-volume zip : $FIRST_PART"
            7zz x "$FIRST_PART" -o../extracted_xcode -y
          elif ls *.part01.rar 1>/dev/null 2>&1 || ls *.part1.rar 1>/dev/null 2>&1; then
            FIRST_PART=$(ls *.part*1.rar | head -n 1)
            echo "Extraction de l'archive multi-volume RAR : $FIRST_PART"
            7zz x "$FIRST_PART" -o../extracted_xcode -y
          elif ls *.tar.gz.* 1>/dev/null 2>&1; then
            echo "Réassemblage et extraction de l'archive .tar.gz découpée..."
            cat *.tar.gz.* | tar -xzf - -C ../extracted_xcode
          elif ls *.tar.* 1>/dev/null 2>&1; then
            echo "Réassemblage et extraction de l'archive .tar découpée..."
            cat *.tar.* | tar -xf - -C ../extracted_xcode
          elif ls *.7z 1>/dev/null 2>&1; then
            for f in *.7z; do 7zz x "$f" -o../extracted_xcode -y; done
          elif ls *.zip 1>/dev/null 2>&1; then
            for f in *.zip; do 7zz x "$f" -o../extracted_xcode -y; done
          else
            echo "ERREUR : Aucune archive reconnue (.7z.001, .zip.001, .tar.gz.*, .7z, .zip) trouvée dans la Release !"
            exit 1
          fi

          cd ..
          rm -rf release_download

          # Recherche automatique du dossier contenant Unity-iPhone.xcodeproj
          XCODEPROJ_DIR=$(find extracted_xcode -name "Unity-iPhone.xcodeproj" -type d | head -n 1 | xargs dirname)
          if [ -z "$XCODEPROJ_DIR" ]; then
            echo "ERREUR : Unity-iPhone.xcodeproj introuvable après extraction !"
            find extracted_xcode -maxdepth 3
            exit 1
          fi

          echo "Projet Xcode trouvé dans : $XCODEPROJ_DIR"
          echo "XCODE_DIR=$XCODEPROJ_DIR" >> "$GITHUB_ENV"

      - name: Select Stable Xcode & Compile Unsigned/Ad-Hoc IPA
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

          # Toujours écraser build_ipa.sh dans le dossier extrait avec la dernière version du dépôt
          if [ -f "ios_xcode_build/build_ipa.sh" ]; then
            cp -f "ios_xcode_build/build_ipa.sh" "$XCODE_DIR/build_ipa.sh"
          fi

          # Appliquer les patchs C++ IL2CPP pour iOS (corrige l'écran blanc / UnauthorizedAccessException sur '/' et désactive les P/Invoke Windows user32/xinput/kernel32/AVPro)
          python3 "$GITHUB_WORKSPACE/scripts/patch_il2cpp_ios.py" "$XCODE_DIR"

          cd "$XCODE_DIR"

          # 1. S'assurer que tous les exécutables IL2CPP et scripts ont les droits d'exécution (perdus lors de la compression 7z sur Windows)
          chmod +x process_symbols.sh 2>/dev/null || true
          chmod +x build_ipa.sh 2>/dev/null || true
          find Il2CppOutputProject -type f \( -name "il2cpp*" -o -name "bee_backend*" -o -name "*.sh" -o -name "clang*" -o -name "ld*" \) -exec chmod +x {} + 2>/dev/null || true
          chmod -R +x Il2CppOutputProject/IL2CPP/build/ 2>/dev/null || true

          # 2. Patcher project.pbxproj pour désactiver totalement la signature de code et CodeSignOnCopy (qui fait planter Embed Frameworks sans certificat Apple)
          PBXPROJ="Unity-iPhone.xcodeproj/project.pbxproj"
          if [ -f "$PBXPROJ" ]; then
            sed -i '' 's/CodeSignOnCopy, //g' "$PBXPROJ"
            sed -i '' 's/"CODE_SIGN_IDENTITY\[sdk=iphoneos\*\]" = "iPhone Developer";/"CODE_SIGN_IDENTITY[sdk=iphoneos*]" = "";/g' "$PBXPROJ"
            sed -i '' 's/CODE_SIGN_IDENTITY = "iPhone Developer";/CODE_SIGN_IDENTITY = "";/g' "$PBXPROJ"
            sed -i '' 's/ProvisioningStyle = Manual;/ProvisioningStyle = Automatic;/g' "$PBXPROJ"
          fi

          # 3. Lancer la compilation en enregistrant tout le log dans xcodebuild.log
          set +e
          xcodebuild build \
            -project "Unity-iPhone.xcodeproj" \
            -scheme "Unity-iPhone" \
            -configuration "Release" \
            -sdk iphoneos \
            -derivedDataPath "$PWD/build_ipa_output/DerivedData" \
            ARCHS="arm64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            EXPANDED_CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            COMPILER_INDEX_STORE_ENABLE=NO 2>&1 | tee "$GITHUB_WORKSPACE/xcodebuild.log"
          BUILD_EXIT_CODE=${PIPESTATUS[0]}
          set -e

          if [ $BUILD_EXIT_CODE -ne 0 ]; then
            echo "## ❌ Échec de la compilation Xcode (Code $BUILD_EXIT_CODE)" >> "$GITHUB_STEP_SUMMARY"
            echo "### 🔍 Lignes d'erreurs détectées :" >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            grep -i -E "(error:|fatal error:|undefined symbols|ld: |clang: error|PhaseScriptExecution failed)" -C 3 "$GITHUB_WORKSPACE/xcodebuild.log" | tail -n 120 >> "$GITHUB_STEP_SUMMARY" || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "### 📜 80 dernières lignes du log Xcode :" >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            tail -n 80 "$GITHUB_WORKSPACE/xcodebuild.log" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            exit $BUILD_EXIT_CODE
          fi

          APP_PATH=$(find "$PWD/build_ipa_output/DerivedData/Build/Products/Release-iphoneos" -maxdepth 1 -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "ERREUR : Le bundle .app n'a pas été trouvé après la compilation Xcode."
            exit 1
          fi

          mkdir -p "$PWD/build_ipa_output/Payload"
          cp -R "$APP_PATH" "$PWD/build_ipa_output/Payload/"
          codesign --force --deep --sign - "$PWD/build_ipa_output/Payload/$(basename "$APP_PATH")" || true
          cd "$PWD/build_ipa_output"
          zip -qry "$GITHUB_WORKSPACE/OriAndTheBlindForestDE_iOS.ipa" Payload

          ls -lh "$GITHUB_WORKSPACE/OriAndTheBlindForestDE_iOS.ipa"
          echo "## ✅ Compilation de l'IPA réussie !" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Xcode Build Log (Toujours disponible même en cas d'erreur)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-logs
          path: xcodebuild.log
          retention-days: 7

      - name: Upload IPA as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OriAndTheBlindForestDE-iOS-IPA
          path: OriAndTheBlindForestDE_iOS.ipa
          retention-days: 14
          compression-level: 0

      - name: Attach Compiled IPA directly to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ github.event.inputs.release_tag }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
        run: |
          TARGET_TAG="${INPUT_TAG:-$EVENT_TAG}"
          if [ -z "$TARGET_TAG" ]; then
            TARGET_TAG=$(gh release view --repo "${{ github.repository }}" --json tagName -q .tagName || true)
          fi

          if [ -n "$TARGET_TAG" ]; then
            IPA_SIZE=$(stat -f%z "$GITHUB_WORKSPACE/OriAndTheBlindForestDE_iOS.ipa")
            echo "Taille de l'IPA généré : $IPA_SIZE octets"
            # GitHub Releases limite chaque fichier individuel à 2 Go (2147483648 octets)
            if [ "$IPA_SIZE" -gt 2000000000 ]; then
              echo "L'IPA dépasse la limite GitHub Release de 2 Go par fichier (4.3 Go). Découpage en parties de 1900 Mo avec 7-Zip (-mx=0, instantané)..."
              7zz a -t7z -mx=0 -v1900m "$GITHUB_WORKSPACE/OriAndTheBlindForestDE_iOS.ipa.7z" "$GITHUB_WORKSPACE/OriAndTheBlindForestDE_iOS.ipa"
              echo "Publication des parties OriAndTheBlindForestDE_iOS.ipa.7z.* dans la Release $TARGET_TAG..."
              gh release upload "$TARGET_TAG" "$GITHUB_WORKSPACE"/OriAndTheBlindForestDE_iOS.ipa.7z.* --clobber --repo "${{ github.repository }}"
              echo "✅ Parties OriAndTheBlindForestDE_iOS.ipa.7z.* ajoutées avec succès à la Release $TARGET_TAG !" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "Publication de OriAndTheBlindForestDE_iOS.ipa dans la Release $TARGET_TAG..."
              gh release upload "$TARGET_TAG" "$GITHUB_WORKSPACE/OriAndTheBlindForestDE_iOS.ipa" --clobber --repo "${{ github.repository }}"
              echo "✅ IPA ajouté avec succès à la Release $TARGET_TAG !" >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
